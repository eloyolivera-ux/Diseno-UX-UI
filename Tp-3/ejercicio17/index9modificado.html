<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tienda de Boca Juniors</title>
    <link rel="stylesheet" href="style17.css">
</head>

<body>

    <nav class="menu">

        <input type="checkbox" id="menu-toggle">

        <label for="menu-toggle" class="menu-icon">☰</label>

        <ul>
            
            <li class="cerrar">
                <label for="menu-toggle">✕</label>
            </li>

            <li><a href="#">Inicio</a></li>
            <li><a href="#">Productos</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>

    </nav>


    <h1>Productos Boca Juniors</h1>

    <div class="galeria">

        <div class="card">
            <img src="remera.jpg" alt="Remera de Boca Juniors">
            <h2>Remera de Boca Juniors</h2>
            <p>$115.000</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="buzo.jpg" alt="Buzo de Boca Juniors">
            <h2>Buzo de Boca Juniors</h2>
            <p>$30.000</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="mochila.jpg" alt="Mochila de Boca Juniors">
            <h2>Mochila de Boca Juniors</h2>
            <p>$25.000</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="gorra.jpg" alt="Gorra de Boca Juniors">
            <h2>Gorra UADER</h2>
            <p>$10.000</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="pantalon.jpg" alt="Pantalon de Boca Juniors">
            <h2>Pantalon de Boca Juniors</h2>
            <p>$8.000</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="pelota.jpg" alt="Pelota de Boca Juniors">
            <h2>Pelota de Boca Juniors</h2>
            <p>$6.000</p>
            <button>Comprar</button>
        </div>

    </div>

</body>

</html>
